version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Run migrations before starting the app
    command: sh -c "npx drizzle-kit push && node server.js"
    volumes:
      - ./sqlite.db:/app/sqlite.db
      - ./public/archives:/app/public/archives
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - AUTH_SECRET=falskjdfalskdjfaslkdjflkasdjf
    depends_on:
      - redis
    restart: unless-stopped

  checker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "src/lib/checker.ts"]
    volumes:
      - ./sqlite.db:/app/sqlite.db
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=falskjdfalskdjfaslkdjflkasdjf
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "src/lib/worker.ts"]
    volumes:
      - ./sqlite.db:/app/sqlite.db
      - ./public/archives:/app/public/archives
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=falskjdfalskdjfaslkdjflkasdjf
    depends_on:
      - redis
    restart: unless-stopped

  ws:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "src/server/ws.ts"]
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
